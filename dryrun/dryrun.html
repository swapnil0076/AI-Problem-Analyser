<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dry Run Logic Flowchart — LeetCode AI Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dryrun.css" />
</head>
<body>
  <!-- Header -->
  <header class="dr-header">
    <div class="dr-brand">
      <div class="dr-icon-badge">🔀</div>
      <div class="dr-title-group">
        <h1 class="dr-problem-title" id="dr-problem-title">Logic Flowchart</h1>
        <span class="dr-difficulty-badge" id="dr-diff-badge"></span>
      </div>
      <span class="dr-pattern-tag" id="dr-pattern-tag">Algorithm Flow</span>
    </div>

    <!-- Zoom & Viewport Controls -->
    <div class="dr-controls-group">
      <div class="dr-zoom-pill">
        <button class="dr-zoom-btn" id="dr-zoom-out" title="Zoom Out">−</button>
        <span class="dr-zoom-val" id="dr-zoom-val">100%</span>
        <button class="dr-zoom-btn" id="dr-zoom-in" title="Zoom In">+</button>
        <button class="dr-zoom-btn reset" id="dr-zoom-reset" title="Reset Zoom">⟲ Reset</button>
      </div>
    </div>
  </header>

  <!-- Main Canvas Viewport -->
  <main class="dr-main">
    <div class="dr-canvas-viewport" id="dr-viewport">
      <div class="dr-canvas-wrapper" id="dr-canvas-wrapper">
        <div class="dr-svg-container" id="dr-svg-container">
          <!-- Rendered Flowchart SVG -->
        </div>
      </div>
    </div>

    <!-- Execution Path Trace Footer -->
    <footer class="dr-footer">
      <div class="dr-footer-header">
        <span class="dr-footer-title">Execution Trace Steps</span>
        <span class="dr-steps-count" id="dr-steps-count"></span>
      </div>
      <div class="dr-steps-grid" id="dr-steps-grid">
        <!-- Interactive Steps rendered here -->
      </div>
    </footer>
  </main>

  <script type="module" src="dryrun.js"></script>
</body>
</html>
